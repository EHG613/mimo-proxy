[package]
name = "mimo-proxy"
version = "2.2.0"
description = "MiMo Reasoning Content Proxy - macOS Client"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "mimo_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
